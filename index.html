<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <!-- Sam's home page: pick a game (Gareth, 2026-11-01, like Charlie's). It
       replaces The Traitors' old Start screen. Each game is in its own
       folder with its own tests. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sam's Games">
  <!-- The Home Screen icon: the castle (Sam). -->
  <link rel="apple-touch-icon" href="traitors/assets/icons/apple-touch-icon.png">
  <link rel="icon" href="traitors/assets/icons/apple-touch-icon.png">
  <title>Sam's Games</title>
  <style>
    @font-face { font-family: "Luckiest Guy"; src: url("traitors/assets/fonts/luckiest-guy.woff2") format("woff2"); font-display: swap; }
    html, body {
      margin: 0;
      height: 100%;
      background: #3b2a6b;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: "Luckiest Guy", ui-rounded, system-ui, sans-serif;
    }
    /* Big picture tiles, side by side on a landscape screen and one above
       the other held upright, clear of the rounded corners. */
    #games {
      position: fixed;
      inset: 0;
      display: flex;
      gap: 4vmin;
      align-items: center;
      justify-content: center;
      padding: max(5vmin, env(safe-area-inset-top)) max(5vmin, env(safe-area-inset-right))
               max(5vmin, env(safe-area-inset-bottom)) max(5vmin, env(safe-area-inset-left));
      box-sizing: border-box;
    }
    @media (orientation: portrait) { #games { flex-direction: column; } }
    .game {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      height: 100%;
      max-height: 80vmin;
      border-radius: 6vmin;
      border: 1.4vmin solid #241238;
      overflow: hidden;
      box-shadow: 0 2vmin 0 #241238;
      box-sizing: border-box;
      display: block;
      color: #fff;
      text-decoration: none;
    }
    a.game:active { transform: translateY(1vmin); box-shadow: 0 1vmin 0 #241238; }
    /* The name along the bottom of each tile. */
    .name {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 2.4vmin 2vmin 1.6vmin;
      text-align: center;
      font-size: max(22px, 6vmin);
      letter-spacing: 0.04em;
      background: rgba(36, 18, 56, 0.82);
    }
    #traitors { background: #241238 url("traitors/assets/castle.jpg") center / cover no-repeat; }
    /* Sam's new game: waiting for its name and picture. */
    #new-game { background: #5b478f; }
    #new-game .mark {
      position: absolute; inset: 0 0 18% 0;
      display: flex; align-items: center; justify-content: center;
      font-size: max(70px, 26vmin); color: #ffd84d;
    }
  </style>
</head>
<body>
  <div id="games">
    <a class="game" id="traitors" href="traitors/"><span class="name">The Traitors</span></a>
    <div class="game" id="new-game"><span class="mark" aria-hidden="true">?</span><span class="name">Coming soon!</span></div>
  </div>
</body>
</html>
