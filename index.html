<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <!-- Fill the iPad screen, no pinch or double-tap zoom while playing. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Added to the Home Screen, it opens full screen like an app. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Project Sam</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 1. The station: Sam's picture and a Start button. -->
  <section id="screen-station" class="screen station">
    <img id="station-picture" src="assets/station.webp" alt="Havenbrook Station">
    <div class="station-panel">
      <h1 id="title">Project Sam</h1>
      <button id="start" class="big">Start</button>
      <p id="version">v0.0.0</p>
    </div>
  </section>

  <!-- 2. Who do you want to be? -->
  <section id="screen-pick" class="screen pick" hidden>
    <h2>Who do you want to be?</h2>
    <div id="cards" class="cards"></div>
    <button id="choose" class="big" disabled>Choose</button>
  </section>

  <!-- 3. Who you are, and your secret: Faithful or Traitor. The castle
       comes next (Phase 3). -->
  <section id="screen-ready" class="screen ready" hidden>
    <div id="ready-badge" class="badge big-badge"></div>
    <h2 id="ready-who"></h2>
    <p id="ready-side" class="ready-side"></p>
    <p class="ready-next">The train to the castle leaves soon...</p>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
